<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Кочевник — меню и заказ</title>
  <meta name="description" content="Меню «Кочевник», Теренколь: бургеры, суши, сеты, пицца. Халал. Заказ в WhatsApp.">
  <meta name="theme-color" content="#120c08">
  <meta property="og:title" content="Кочевник — меню">
  <meta property="og:description" content="Бургеры, суши, сеты, пицца. Заказ в WhatsApp в пару нажатий.">
  <meta property="og:image" content="img/og.jpg">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20261108221517">
</head>
<body>
  <header class="top">
    <div class="top__glow" aria-hidden="true"></div>
    <img class="top__logo" src="img/logo.svg" alt="" width="64" height="64">
    <h1 class="top__name" data-cfg="name">Кочевник</h1>
    <p class="top__slogan" data-cfg="slogan"></p>
    <p class="top__place" data-cfg="place"></p>
    <nav class="top__links">
      <a class="pill" id="lnkCall" href="#"><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>Позвонить</a>
      <a class="pill" id="lnkWa" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.3-.5 0-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .5l-.3.5-.4.5c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.1 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l2 1c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>WhatsApp</a>
      <a class="pill" id="lnkIg" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M12 7.3A4.7 4.7 0 1 0 12 16.7 4.7 4.7 0 0 0 12 7.3zm0 7.7a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm6-7.9a1.1 1.1 0 1 1-2.2 0 1.1 1.1 0 0 1 2.2 0zM21.9 8c0-1.6-.4-3-1.6-4.2S17.6 2.1 16 2c-1.6-.1-6.4-.1-8 0-1.6.1-3 .4-4.2 1.6S2.1 6.4 2 8c-.1 1.6-.1 6.4 0 8 .1 1.6.4 3 1.6 4.2S6.4 21.9 8 22c1.6.1 6.4.1 8 0 1.6-.1 3-.4 4.2-1.6s1.5-2.6 1.6-4.2c.1-1.6.1-6.4 0-8zM19.8 18a3.3 3.3 0 0 1-1.8 1.8c-1.3.5-4.3.4-5.9.4s-4.6.1-5.9-.4A3.3 3.3 0 0 1 4.4 18c-.5-1.3-.4-4.3-.4-5.9s-.1-4.6.4-5.9A3.3 3.3 0 0 1 6.2 4.4C7.5 3.9 10.5 4 12 4s4.6-.1 5.9.4a3.3 3.3 0 0 1 1.8 1.8c.5 1.3.4 4.3.4 5.9s.1 4.6-.4 5.9z"/></svg>Instagram</a>
    </nav>
  </header>

  <section class="hero" id="hero" hidden>
    <div class="hero__sticky">
      <div class="hero__head">
        <span class="hero__kicker">Хит заведения</span>
        <h2 class="hero__title" id="heroName"></h2>
        <div class="hero__switch" id="heroSwitch" role="tablist" aria-label="Выбрать блюдо" hidden></div>
      </div>
      <div class="stage" id="stage" role="button" tabindex="0" aria-label="Показать бургер по слоям"></div>
      <div class="hero__foot">
        <p class="hero__desc" id="heroDesc"></p>
        <button class="btn btn--accent" id="heroAdd"></button>
        <p class="hero__hint" id="heroHint"></p>
      </div>
    </div>
  </section>

  <nav class="tabs" id="tabs" aria-label="Категории"></nav>
  <main class="menu" id="menu"></main>

  <footer class="foot">
    <p><b data-cfg="name"></b> · <span data-cfg="place"></span></p>
    <p class="foot__small">Цены в тенге. Заказ уходит в WhatsApp заведения, оплата при получении.</p>
  </footer>

  <button class="cartbar" id="cartbar" hidden>
    <span class="cartbar__count" id="cartCount">0</span>
    <span class="cartbar__label">Корзина</span>
    <span class="cartbar__sum" id="cartSum"></span>
  </button>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet__backdrop" data-close></div>
    <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet__grip" data-close></div>
      <div class="sheet__head">
        <h2 id="sheetTitle">Ваш заказ</h2>
        <button class="iconbtn" data-close aria-label="Закрыть">✕</button>
      </div>
      <ul class="lines" id="lines"></ul>
      <form class="order" id="orderForm" autocomplete="on">
        <div class="seg" role="radiogroup" aria-label="Получение">
          <label><input type="radio" name="mode" value="delivery" checked><span>Доставка</span></label>
          <label><input type="radio" name="mode" value="pickup"><span>Самовывоз</span></label>
        </div>
        <label class="field" id="addrField"><span>Адрес</span><input name="address" placeholder="Улица, дом, квартира" autocomplete="street-address"></label>
        <label class="field"><span>Имя</span><input name="name" placeholder="Как к вам обращаться" autocomplete="given-name"></label>
        <label class="field"><span>Комментарий</span><input name="comment" placeholder="Без лука, сдача с 10 000…"></label>
        <div class="total"><span>Итого</span><b id="total"></b></div>
        <button class="btn btn--wa" type="submit">
          <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2z"/></svg>
          Заказать в WhatsApp
        </button>
        <p class="order__note">Откроется WhatsApp с готовым текстом заказа — останется нажать «Отправить».</p>
      </form>
    </div>
  </div>

  <div class="dish" id="dish" hidden>
    <div class="sheet__backdrop" data-close></div>
    <div class="dish__panel" role="dialog" aria-modal="true">
      <button class="iconbtn dish__x" data-close aria-label="Закрыть">✕</button>
      <div class="dish__img"><img id="dishImg" alt=""></div>
      <div class="dish__body">
        <h3 id="dishName"></h3>
        <p id="dishDesc"></p>
        <div class="dish__row">
          <b id="dishPrice"></b>
          <div class="qty" id="dishQty"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js?v=20261108221517"></script>
</body>
</html>
